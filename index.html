<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A collection of 30 JavaScript projects built with HTML, CSS, and vanilla JavaScript."
    />
    <title>JavaScript 30 — Project Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="site-shell">
      <header class="hero">
        <h1>JavaScript <em>30</em></h1>
        <p class="intro">
          My javascript30 Collection of 30 projects taught wes bos.
        </p>
        <div class="progress-row" aria-label="1 of 30 projects completed">
          <div class="progress-track"><span></span></div>
          <span class="progress-label"><strong>01</strong> / 30 projects</span>
        </div>
      </header>

      <section class="projects-section" aria-labelledby="projects-title">
        <div class="section-heading">
          <div>
            <h2 id="projects-title">Projects</h2>
          </div>
          <p class="section-note">Click a project to try it live.</p>
        </div>

        <!-- Add future project cards below this one. Keep each project in its own folder. -->
        <div class="project-grid">
          <article class="project-card">
            <a
              class="project-image-link"
              href="JavsScriptDrumstick/index.html"
              aria-label="Open JavaScript Drum Kit"
            >
              <img
                src="JavsScriptDrumstick/projectLive.png"
                alt="Preview of the JavaScript Drum Kit project"
              />
              <span class="launch-label"
                >Open project <span aria-hidden="true">↗</span></span
              >
            </a>
            <div class="project-info">
              <div class="project-number">01 <span>/ 30</span></div>
              <h3>JavaScript Drum Kit</h3>
              <p>
                Play a collection of drum sounds with your keyboard or mouse.
              </p>
              <div class="tags">
                <span>HTML</span><span>CSS</span><span>JavaScript</span>
              </div>
            </div>
          </article>

          <div class="empty-card" aria-label="More projects coming soon">
            <span class="empty-number">02—30</span>
            <span class="empty-plus">+</span>
            <p>More experiments<br />coming soon</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
